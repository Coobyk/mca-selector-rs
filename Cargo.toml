[workspace]
resolver = "2"
members = ["crates/mc-core", "crates/mca-selector"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fastnbt = "2.6"
flate2 = { version = "1", features = ["zlib-rs"] }
anyhow = "1"
thiserror = "2"
rayon = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }

# gpui 0.2.2 pulls xattr 0.2.3 (via zed-async-tar), which references
# libc::ENOATTR — removed from libc on Linux. Vendored fix: ENODATA.
[patch.crates-io]
xattr = { path = "patches/xattr" }
