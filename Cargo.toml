[workspace]
resolver = "2"
members = ["crates/mc-core", "crates/mca-selector", "crates/mca-selector-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
rayon = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", features = ["zlib-rs"] }
lz4_flex = "0.11"
image = "0.25"
base64 = "0.22"
md-5 = "0.10"
parking_lot = "0.12"
indexmap = "2"

[profile.release]
lto = true
codegen-units = 1

# gpui 0.2.2 pulls xattr 0.2.3 (via zed-async-tar), which references
# libc::ENOATTR — removed from libc on Linux. Vendored fix: ENODATA.
[patch.crates-io]
xattr = { path = "patches/xattr" }
# Vendored gpui 0.2.2 with a fail-soft atlas upload: zero/oversized sprites
# return None instead of panicking in blade_atlas (upstream unwrap crash).
gpui = { path = "patches/gpui" }
