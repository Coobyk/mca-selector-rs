name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mca-selector-linux-x86_64
            bin: mca-selector
          - os: macos-latest
            artifact: mca-selector-macos-aarch64
            bin: mca-selector
          - os: windows-latest
            artifact: mca-selector-windows-x86_64.exe
            bin: mca-selector.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libasound2-dev \
            libssl-dev libzstd-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p mca-selector

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}

  aur:
    name: publish to AUR
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 30 aur.archlinux.org >> ~/.ssh/known_hosts || true
          cat ~/.ssh/known_hosts || true
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Generate .SRCINFO
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo' > aur/.SRCINFO

      - name: Publish to AUR
        env:
          AUR_PACKAGE: mca-selector-rs-git
        run: |
          git config --global user.name "mca-selector-rs-ci"
          git config --global user.email "mail@coobyk.com"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" /tmp/aur-repo
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date"
          else
            git commit -m "Update to $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
            git push
          fi
