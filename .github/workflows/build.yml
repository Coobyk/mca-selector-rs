name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mca-selector-linux-x86_64
            packages: mca-selector-linux-x86_64-packages
            package_dir: dist/linux
            bin: mca-selector
          - os: macos-latest
            artifact: mca-selector-macos-aarch64
            packages: mca-selector-macos-aarch64-packages
            package_dir: dist/macos
            bin: mca-selector
          - os: windows-latest
            artifact: mca-selector-windows-x86_64.exe
            packages: mca-selector-windows-x86_64-packages
            package_dir: dist/windows
            bin: mca-selector.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libasound2-dev \
            libssl-dev libzstd-dev libvulkan-dev zip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p mca-selector

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: bash packaging/linux-package.sh

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version="0.1.0"
          fi
          bash packaging/macos-dmg.sh target/release/mca-selector dist/macos "$version"

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows-package.ps1 -Binary target/release/mca-selector.exe -OutDir dist/windows

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.packages }}
          path: ${{ matrix.package_dir }}/*
          if-no-files-found: error

  release:
    name: publish nightly release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pkgver: ${{ steps.meta.outputs.pkgver }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - id: meta
        run: |
          mkdir -p release
          mv dist/mca-selector-linux-x86_64/mca-selector release/mca-selector-linux-x86_64
          mv dist/mca-selector-macos-aarch64/mca-selector release/mca-selector-macos-aarch64
          mv dist/mca-selector-windows-x86_64.exe/mca-selector.exe release/mca-selector-windows-x86_64.exe
          cp dist/mca-selector-linux-x86_64-packages/* release/
          cp dist/mca-selector-macos-aarch64-packages/* release/
          cp dist/mca-selector-windows-x86_64-packages/* release/
          chmod +x release/mca-selector-linux-x86_64 release/mca-selector-linux-x86_64.AppImage
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "pkgver=0.1.0.r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "sha256=$(sha256sum release/mca-selector-linux-x86_64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Move nightly tag to this commit (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

      - name: Publish tagged release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME — Linux AppImage/ZIP, Windows portable EXE/ZIP, and macOS DMG." \
            --latest \
            release/*

      - name: Publish nightly assets (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly release/* --clobber
          else
            gh release create nightly --prerelease \
              --title "nightly — latest main" \
              --notes "Rolling Linux AppImage/ZIP, Windows portable EXE/ZIP, and macOS DMG builds of the latest main commit. The raw Linux binary is installed by the mca-selector-rs-bin AUR package." \
              release/*
          fi

  aur:
    name: publish to AUR
    needs: release
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 30 aur.archlinux.org >> ~/.ssh/known_hosts || true
          cat ~/.ssh/known_hosts || true
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Generate .SRCINFO
        env:
          PKGVER: ${{ needs.release.outputs.pkgver }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo' > aur/.SRCINFO
          mkdir -p /tmp/bin-pkg
          sed -e "s/__PKGVER__/$PKGVER/" -e "s/__SHA256__/$SHA256/" \
              aur/bin/PKGBUILD.template > /tmp/bin-pkg/PKGBUILD
          chown -R builder:builder /tmp/bin-pkg
          su builder -c 'cd /tmp/bin-pkg && makepkg --printsrcinfo' > /tmp/bin-pkg/.SRCINFO

      - name: Publish to AUR
        run: |
          git config --global user.name "mca-selector-rs-ci"
          git config --global user.email "mail@coobyk.com"
          retry_ssh() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed, retrying in $((i * 20))s"
              sleep $((i * 20))
            done
            return 1
          }
          publish() {
            pkg="$1"; srcdir="$2"
            retry_ssh git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "/tmp/aur-${pkg}"
            cp "${srcdir}/PKGBUILD" "${srcdir}/.SRCINFO" "/tmp/aur-${pkg}/"
            cd "/tmp/aur-${pkg}"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "$pkg already up to date"
            else
              git commit -m "Update to ${GITHUB_SHA:0:7}"
              retry_ssh git push
            fi
            cd "$GITHUB_WORKSPACE"
          }
          publish mca-selector-rs-git aur
          publish mca-selector-rs-bin /tmp/bin-pkg
